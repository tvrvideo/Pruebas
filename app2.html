<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclado PRO v2.2</title>

<style>
:root{
  --kb-bg:#d1d5db;
  --key-bg:#ffffff;
  --key-color:#000;
}

body{
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:#fff;
  padding:20px;
}

input{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:10px;
  border:none;
  margin-bottom:20px;
}

.keyboard{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--kb-bg);
  padding:8px;
  display:none;
}

.row{
  display:flex;
  justify-content:center;
  margin-bottom:6px;
}

.key{
  background:var(--key-bg);
  color:var(--key-color);
  margin:3px;
  padding:12px 10px;
  border-radius:6px;
  font-size:16px;
  min-width:32px;
  text-align:center;
}

.key.dark{background:#9ca3af;}
.key.space{flex:1;}
.key.action{background:#3b82f6;color:#fff;}

.settings{
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:10px;
  border-radius:10px;
}

</style>
</head>

<body>

<h2>Teclado PRO v2.2</h2>

<input id="input1" placeholder="Tocar para escribir" readonly onclick="openKeyboard(this)">

<div class="settings">
  <label>Fondo teclado</label><br>
  <input type="color" onchange="setVar('--kb-bg', this.value)">
  <br>
  <label>Color teclas</label><br>
  <input type="color" onchange="setVar('--key-bg', this.value)">
  <br>
  <label>Texto teclas</label><br>
  <input type="color" onchange="setVar('--key-color', this.value)">
</div>

<div class="keyboard" id="kb"></div>

<script>

let current = null;
let shift = false;
let mode = "letters";

const kb = document.getElementById("kb");

function setVar(name,val){
  document.documentElement.style.setProperty(name,val);
}

function openKeyboard(el){
  current = el;
  kb.style.display = "block";
  render();
}

function render(){
  kb.innerHTML = "";

  let layout = mode==="letters"
    ? ["qwertyuiop","asdfghjklñ","zxcvbnm"]
    : ["1234567890","-/:;()€&@",".,?!'"];

  layout.forEach(r=>{
    let row=document.createElement("div");
    row.className="row";

    r.split("").forEach(k=>{
      let key=document.createElement("div");
      key.className="key";
      key.textContent=shift?k.toUpperCase():k;
      key.onclick=()=>press(k);
      row.appendChild(key);
    });

    kb.appendChild(row);
  });

  let last=document.createElement("div");
  last.className="row";

  last.innerHTML=`
    <div class="key dark" onclick="toggleShift()">↑</div>
    <div class="key dark" onclick="toggleMode()">${mode==="letters"?"123":"ABC"}</div>
    <div class="key space" onclick="press(' ')">espacio</div>
    <div class="key dark" onclick="del()">⌫</div>
    <div class="key action" onclick="closeKB()">OK</div>
  `;

  kb.appendChild(last);
}

function press(k){
  if(!current) return;
  current.value += shift?k.toUpperCase():k;
  if(shift) shift=false;
  render();
}

function del(){
  if(current) current.value=current.value.slice(0,-1);
}

function toggleShift(){
  shift=!shift;
  render();
}

function toggleMode(){
  mode=mode==="letters"?"num":"letters";
  render();
}

function closeKB(){
  kb.style.display="none";
}

</script>

</body>
</html>
