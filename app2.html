<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teclado PRO v2.5 (Modular)</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:#fff;
  padding:20px;
}

/* INPUT SIMULADO */
.inputBox{
  width:100%;
  padding:14px;
  font-size:20px;
  border-radius:10px;
  background:#fff;
  color:#000;
  margin-bottom:20px;
  min-height:26px;
}

/* cursor */
.cursor{
  display:inline-block;
  width:2px;
  height:22px;
  background:#000;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,50%,100%{opacity:1;}
  25%,75%{opacity:0;}
}

/* teclado */
.keyboard{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#d1d5db;
  padding:6px;
  display:none;
}

.row{
  display:flex;
  justify-content:center;
  margin-bottom:4px;
}

.key{
  background:#fff;
  color:#000;
  margin:2px;
  padding:10px 6px;
  border-radius:6px;
  font-size:18px;
  min-width:28px;
  text-align:center;
  flex:1;
}

.key.small{flex:0.7;}
.key.space{flex:3;}
.key.action{background:#3b82f6;color:#fff;}
.key.dark{background:#9ca3af;}
</style>
</head>

<body>

<h2>Teclado PRO v2.5 (Reusable)</h2>

<div class="inputBox" onclick="openKeyboard()">
  <span id="text"></span><span id="cursor" class="cursor"></span>
</div>

<div class="keyboard" id="kb"></div>

<script>
// ====== CORE ======
let value = "";
let cursorPos = 0;

let shift=false;
let caps=false;
let lastShiftTime=0;
let mode="letters";

const kb=document.getElementById("kb");
const textEl=document.getElementById("text");

// ====== INPUT ======
function updateText(){
  let before = value.slice(0,cursorPos);
  let after = value.slice(cursorPos);
  textEl.innerHTML = before + '<span class="cursor"></span>' + after;
}

function openKeyboard(){
  kb.style.display="block";
  render();
  updateText();
}

// ====== RENDER ======
function render(){
  kb.innerHTML="";

  let layout = mode==="letters"
    ? ["qwertyuiop","asdfghjklñ","zxcvbnm"]
    : ["1234567890","-/:;()€&@",".,?!'"];

  layout.forEach(r=>{
    let row=document.createElement("div");
    row.className="row";

    r.split("").forEach(k=>{
      let key=document.createElement("div");
      key.className="key";
      let char=(caps||shift)?k.toUpperCase():k;
      key.textContent=char;
      key.onclick=()=>press(k);
      row.appendChild(key);
    });

    kb.appendChild(row);
  });

  let last=document.createElement("div");
  last.className="row";

  last.innerHTML=`
    <div class="key dark small" onclick="handleShift()">↑</div>
    <div class="key dark small" onclick="toggleMode()">${mode==="letters"?"123":"ABC"}</div>
    <div class="key space" onclick="press(' ')">espacio</div>
    <div class="key dark small" onclick="del()">⌫</div>
    <div class="key action small" onclick="closeKB()">OK</div>
  `;

  kb.appendChild(last);
}

// ====== ACTIONS ======
function press(k){
  let char=(caps||shift)?k.toUpperCase():k;
  value = value.slice(0,cursorPos) + char + value.slice(cursorPos);
  cursorPos++;

  if(shift && !caps) shift=false;

  updateText();
  render();
}

function del(){
  if(cursorPos===0) return;
  value = value.slice(0,cursorPos-1) + value.slice(cursorPos);
  cursorPos--;
  updateText();
}

function handleShift(){
  let now=Date.now();
  if(now-lastShiftTime<300){
    caps=!caps;
    shift=false;
  }else{
    shift=!shift;
  }
  lastShiftTime=now;
  render();
}

function toggleMode(){
  mode=mode==="letters"?"num":"letters";
  render();
}

function closeKB(){
  kb.style.display="none";
}

// ====== CURSOR TAP ======
document.querySelector(".inputBox").addEventListener("click", function(e){
  let rect = this.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let approx = Math.floor((x / rect.width) * (value.length+1));
  cursorPos = Math.max(0, Math.min(value.length, approx));
  updateText();
});

</script>

</body>
</html>
