<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App v1.4 Teclado Virtual</title>

<style>
body{font-family:Arial;padding:20px;}
input{width:100%;padding:12px;font-size:16px;margin-bottom:10px;}

.keyboard{
 position:fixed;bottom:0;left:0;right:0;
 background:#222;padding:10px;
 display:grid;grid-template-columns:repeat(10,1fr);
 gap:5px;
}

.key{
 background:#0E4C92;color:#fff;
 padding:12px;text-align:center;
 border-radius:6px;font-size:14px;
}

.key.ok{
 grid-column: span 5;
 background:#2e7d32;
}

.key.del{
 grid-column: span 5;
 background:#c62828;
}
</style>
</head>

<body>

<h2>Teclado Virtual v1.4</h2>

<input id="input1" placeholder="Escribir..." readonly>

<div class="keyboard" id="kb"></div>

<script>
const keys = "1234567890qwertyuiopasdfghjklzxcvbnm".split("");
const kb = document.getElementById("kb");
let current = document.getElementById("input1");

keys.forEach(k=>{
 let b = document.createElement("div");
 b.className="key";
 b.textContent=k;
 b.onclick=()=>{ current.value += k; };
 kb.appendChild(b);
});

// borrar
let del = document.createElement("div");
del.className="key del";
del.textContent="← Borrar";
del.onclick=()=>{ current.value = current.value.slice(0,-1); };
kb.appendChild(del);

// OK cerrar teclado
let ok = document.createElement("div");
ok.className="key ok";
ok.textContent="OK";
ok.onclick=()=>{
 document.getElementById("kb").style.display = "none";
};
kb.appendChild(ok);
</script>

</body>
</html>
