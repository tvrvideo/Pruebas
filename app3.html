<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Index v4.3 Teclado PRO</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:#fff;
  padding:20px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  margin-bottom:15px;
  font-size:16px;
}

#btnKeyboard{
  position:fixed;
  bottom:100px;
  right:20px;
  z-index:9999;
  padding:12px;
  border-radius:12px;
  background:#0E4C92;
  color:#fff;
  font-weight:bold;
  display:none;
}

#keyboard{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#d1d5db;
  padding:8px;
  display:none;
}

.row{
  display:flex;
  justify-content:center;
  margin-bottom:6px;
}

.key{
  flex:1;
  margin:3px;
  padding:14px;
  background:#fff;
  border-radius:10px;
  text-align:center;
  color:#000;
  font-size:18px;
}

.space{flex:4;}
.dark{background:#9ca3af;}
.enter{background:#3b82f6;color:#fff;}

#settings{
  position:fixed;
  top:20px;
  right:20px;
  background:#111;
  padding:10px;
  border-radius:10px;
  z-index:9999;
}
</style>
</head>

<body>

<h2>App teclado integrada v4.3</h2>

<input placeholder="Campo 1">
<input placeholder="Campo 2">
<input placeholder="Campo 3">

<button id="btnKeyboard">⌨️</button>

<div id="settings">
  🎨 Color teclas<br>
  <input type="color" id="colorKeys" value="#ffffff">
  <br><br>
  🎨 Fondo teclado<br>
  <input type="color" id="colorBg" value="#d1d5db">
</div>

<div id="keyboard"></div>

<script>
let currentInput=null;
let shift=false;

const kb=document.getElementById("keyboard");

document.addEventListener("focusin",e=>{
  if(e.target.tagName==="INPUT"){
    currentInput=e.target;
    document.getElementById("btnKeyboard").style.display="block";
  }
});

document.getElementById("btnKeyboard").onclick=()=>{
  kb.style.display = kb.style.display==="block" ? "none" : "block";
};

function render(){
  kb.innerHTML="";

  ["qwertyuiop","asdfghjklñ","zxcvbnm"].forEach((r,i)=>{
    let row=document.createElement("div");
    row.className="row";

    if(i===2){
      row.appendChild(createKey("↑","dark"));
    }

    r.split("").forEach(k=>{
      row.appendChild(createKey(k));
    });

    if(i===2){
      row.appendChild(createKey("⌫","dark"));
    }

    kb.appendChild(row);
  });

  let last=document.createElement("div");
  last.className="row";

  last.appendChild(createKey("123","dark"));
  last.appendChild(createKey("espacio","space"));
  last.appendChild(createKey("OK","enter"));

  kb.appendChild(last);
}

function createKey(k,cls=""){
  let key=document.createElement("div");
  key.className="key "+cls;
  key.textContent=shift?k.toUpperCase():k;
  key.onclick=()=>press(k);
  return key;
}

function press(k){
  if(!currentInput) return;

  if(k==="↑"){
    shift=!shift;
    render();
    return;
  }

  if(k==="⌫"){
    let start=currentInput.selectionStart;
    let end=currentInput.selectionEnd;
    let text=currentInput.value;

    if(start>0){
      currentInput.value =
        text.substring(0,start-1) +
        text.substring(end);

      currentInput.setSelectionRange(start-1,start-1);
    }
    return;
  }

  if(k==="espacio"){
    insertText(" ");
    return;
  }

  if(k==="OK"){
    kb.style.display="none";
    return;
  }

  if(k.length===1){
    insertText(shift?k.toUpperCase():k);
    if(shift) shift=false;
  }
}

function insertText(char){
  let start=currentInput.selectionStart;
  let end=currentInput.selectionEnd;
  let text=currentInput.value;

  currentInput.value =
    text.substring(0,start) +
    char +
    text.substring(end);

  currentInput.setSelectionRange(start+1,start+1);
}

document.getElementById("colorKeys").oninput=(e)=>{
  document.querySelectorAll(".key").forEach(k=>{
    k.style.background=e.target.value;
  });
};

document.getElementById("colorBg").oninput=(e)=>{
  kb.style.background=e.target.value;
};

render();
</script>

</body>
</html>
