<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teclado PRO v2.3</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:#fff;
  padding:20px;
}

input{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:10px;
  border:none;
  margin-bottom:20px;
}

.keyboard{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#d1d5db;
  padding:6px;
  display:none;
}

.row{
  display:flex;
  justify-content:center;
  margin-bottom:4px;
}

.key{
  background:#fff;
  color:#000;
  margin:2px;
  padding:10px 6px;
  border-radius:6px;
  font-size:14px;
  min-width:28px;
  text-align:center;
  flex:1;
}

.key.small{
  flex:0.7;
}

.key.space{
  flex:3;
}

.key.action{
  background:#3b82f6;
  color:#fff;
}

.key.dark{
  background:#9ca3af;
}
</style>
</head>

<body>

<h2>Teclado PRO v2.3</h2>

<input id="input1" placeholder="Tocar para escribir" readonly onclick="openKeyboard(this)">

<div class="keyboard" id="kb"></div>

<script>
let current=null;
let shift=false;
let caps=false;
let lastShiftTime=0;
let mode="letters";

const kb=document.getElementById("kb");

function openKeyboard(el){
  current=el;
  kb.style.display="block";
  render();
}

function render(){
  kb.innerHTML="";

  let layout = mode==="letters"
    ? ["qwertyuiop","asdfghjklñ","zxcvbnm"]
    : ["1234567890","-/:;()€&@",".,?!'"];

  layout.forEach(r=>{
    let row=document.createElement("div");
    row.className="row";

    r.split("").forEach(k=>{
      let key=document.createElement("div");
      key.className="key";
      let char = (caps || shift) ? k.toUpperCase() : k;
      key.textContent=char;
      key.onclick=()=>press(k);
      row.appendChild(key);
    });

    kb.appendChild(row);
  });

  let last=document.createElement("div");
  last.className="row";

  last.innerHTML=`
    <div class="key dark small" onclick="handleShift()">↑</div>
    <div class="key dark small" onclick="toggleMode()">${mode==="letters"?"123":"ABC"}</div>
    <div class="key space" onclick="press(' ')">espacio</div>
    <div class="key dark small" onclick="del()">⌫</div>
    <div class="key action small" onclick="closeKB()">OK</div>
  `;

  kb.appendChild(last);
}

function press(k){
  if(!current) return;
  let val = (caps || shift) ? k.toUpperCase() : k;
  current.value += val;
  if(shift && !caps) shift=false;
  render();
}

function del(){
  if(current) current.value=current.value.slice(0,-1);
}

function handleShift(){
  let now = Date.now();
  if(now - lastShiftTime < 300){
    caps = !caps; // doble toque
    shift = false;
  } else {
    shift = !shift;
  }
  lastShiftTime = now;
  render();
}

function toggleMode(){
  mode=mode==="letters"?"num":"letters";
  render();
}

function closeKB(){
  kb.style.display="none";
}
</script>

</body>
</html>
