<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pruebas v1.2</title>

<style>
body{
  margin:0;
  font-family:-apple-system, Arial;
  background:#0b1220;
  color:#fff;
}
.header{
  padding:20px;
  text-align:center;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:16px;
}
button{
  padding:16px;
  border-radius:14px;
  border:none;
  background:#0E4C92;
  color:#fff;
  font-size:16px;
}
.hint{
  font-size:12px;
  opacity:.6;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🧪 Pruebas v1.2</h2>
  <div class="hint">Las apps se abrirán automáticamente donde funcionen mejor</div>
</div>

<div class="grid">
  <button onclick="openApp('app.html')">App 1</button>
  <button onclick="openApp('app2.html')">App 2</button>
  <button onclick="openApp('app3.html')">App 3</button>
  <button onclick="openApp('app4.html')">App 4</button>
</div>

<script>
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function isStandalone(){
  return window.navigator.standalone === true;
}

function openApp(file){
  if(isIOS() && isStandalone()){
    window.location.href = file;
    setTimeout(()=>{
      window.open(file, "_blank");
    }, 100);
  } else {
    window.location.href = file;
  }
}
</script>

</body>
</html>
