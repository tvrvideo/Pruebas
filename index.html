<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<title>Pruebas</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E4C92">
<link rel="apple-touch-icon" href="icono.png">

<style>
:root{
  --bg:#0b1220;
  --card:#121b2f;
  --primary:#0E4C92;
  --text:#eaf0ff;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

.header{
  padding:20px;
  padding-top:40px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
  font-weight:900;
}

.sub{
  margin-top:6px;
  opacity:.6;
  font-size:14px;
}

.version{
  margin-top:8px;
  font-size:12px;
  opacity:.5;
}

.container{
  padding:16px;
  max-width:520px;
  margin:0 auto;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  border:1px solid rgba(255,255,255,.08);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  background:linear-gradient(135deg,#0E4C92,#1976d2);
  color:#fff;
  font-weight:900;
  font-size:15px;
  box-shadow:0 8px 18px rgba(14,76,146,.35);
}

button:active{
  transform:scale(.96);
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  opacity:.5;
}
</style>
</head>

<body>

<div class="header">
  <h1>🧪 Pruebas</h1>
  <div class="sub">Selecciona una app</div>
  <div class="version">v1.0</div>
</div>

<div class="container">
  <div class="card">

    <div class="grid">
      <button onclick="go('app.html')">App 1</button>
      <button onclick="go('app2.html')">App 2</button>
      <button onclick="go('app3.html')">App 3</button>
      <button onclick="go('app4.html')">App 4</button>
      <button onclick="go('app5.html')">App 5</button>
      <button onclick="go('app6.html')">App 6</button>
      <button onclick="go('app7.html')">App 7</button>
      <button onclick="go('app8.html')">App 8</button>
      <button onclick="go('app9.html')">App 9</button>
      <button onclick="go('app10.html')">App 10</button>
      <button onclick="go('app11.html')">App 11</button>
      <button onclick="go('app12.html')">App 12</button>
    </div>

  </div>

  <div class="footer">iOS Test Lab</div>
</div>

<script>
function go(file){
  window.location.href = file;
}
</script>

</body>
</html>
